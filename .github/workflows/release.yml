name: Build & Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Stamp GitHub repo into version.json & extract release notes
        id: meta
        shell: pwsh
        run: |
          $v = Get-Content "version.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          $v | Add-Member -NotePropertyName "update_repo" -NotePropertyValue "https://github.com/${{ github.repository }}" -Force
          $v | ConvertTo-Json -Depth 4 | Set-Content "version.json" -Encoding UTF8
          $ver = ($v.version -replace '^[vV]', '')
          $tag = "v$ver"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $chg = Get-Content "CHANGELOG.md" -Raw -Encoding UTF8
          if ($chg -match "(?ms)^## \[$([regex]::Escape($ver))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)") {
            $Matches[1].Trim() | Set-Content "release_notes.md" -Encoding UTF8
          } else {
            $v.changelog | Set-Content "release_notes.md" -Encoding UTF8
          }

      - name: Compile native RAM secret bridge & Build EXE
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /optimize+ /target:exe /r:System.Web.Extensions.dll /out:"assets\aiconomy-bridge.exe" "app\bridge_host.cs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --dev
          uv run pyinstaller --noconfirm --onefile --windowed --name "AIconomy" `
            --icon "assets/aiconomy.ico" `
            --add-data "version.json;." `
            --add-data "assets;assets" `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtPdf `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtQuick `
            main.py

      - name: Publish GitHub Release with AIconomy.exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "AIconomy ${{ steps.meta.outputs.tag }}"
          body_path: release_notes.md
          files: dist/AIconomy.exe
