name: Build & Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Stamp GitHub repo into version.json & read version
        id: meta
        shell: pwsh
        run: |
          $v = Get-Content "version.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          $v | Add-Member -NotePropertyName "update_repo" -NotePropertyValue "https://github.com/${{ github.repository }}" -Force
          $v | ConvertTo-Json -Depth 4 | Set-Content "version.json" -Encoding UTF8
          $tag = "v" + ($v.version -replace '^[vV]', '')
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "changelog=$($v.changelog)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Sync dependencies & Build EXE
        run: |
          uv sync --dev
          uv run pyinstaller --noconfirm --onefile --windowed --name "AIconomy" `
            --icon "assets/aiconomy.ico" `
            --add-data "version.json;." `
            --add-data "assets;assets" `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtPdf `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtQuick `
            main.py

      - name: Publish GitHub Release with AIconomy.exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "AIconomy ${{ steps.meta.outputs.tag }}"
          body: ${{ steps.meta.outputs.changelog }}
          files: dist/AIconomy.exe
